<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Group Finance Manager</title>
<style>
  :root{
    --primary:#0D47A1;
    --primary-light:#5472D3;
    --primary-dark:#002171;
    --accent:#2196F3;
    --bg:#F5F8FF;
    --surface:#FFFFFF;
    --text:#0A1F44;
    --muted:#6B7A99;
    --success:#2E7D32;
    --warning:#B8860B;
    --danger:#C62828;
    --border:#DCE6F5;
    --banner-bg:#FFF6E5;
    --banner-border:#F0D9A0;
    --banner-text:#7a5b00;
    --table-head:#F0F5FF;
    --creds-bg:#F0F7FF;
  }
  body.dark-mode{
    --primary:#4C7FE0;
    --primary-light:#7CA2EA;
    --primary-dark:#294F94;
    --accent:#64B5F6;
    --bg:#0E1420;
    --surface:#1A2333;
    --text:#EAF0FF;
    --muted:#9FB0CC;
    --success:#5FCB74;
    --warning:#F0C24B;
    --danger:#FF6B6B;
    --border:#2C3A52;
    --banner-bg:#3A3212;
    --banner-border:#5C4E1C;
    --banner-text:#F0D98A;
    --table-head:#232E42;
    --creds-bg:#1E2A40;
  }
  body.dark-mode .badge.paid{background:#193B22;color:var(--success);}
  body.dark-mode .badge.pending{background:#3A3212;color:var(--warning);}
  body.dark-mode .badge.overdue{background:#3B1E1E;color:var(--danger);}
  body.dark-mode input[type=text],
  body.dark-mode input[type=password],
  body.dark-mode input[type=number],
  body.dark-mode input[type=tel],
  body.dark-mode select,
  body.dark-mode textarea{ color-scheme: dark; }
  body.dark-mode ::placeholder{ color:#7385A6; }
  body.dark-mode .logo-circle{ background:#EAF0FF; }
  body.dark-mode .icon-btn{ color:#EAF0FF; }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
  a{color:var(--primary);text-decoration:none;}

  /* ---- top bar ---- */
  .topbar{
    background:var(--primary);color:#fff;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .logo-circle{
    width:34px;height:34px;border-radius:50%;background:#fff;color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;
  }
  .topbar h1{font-size:15px;margin:0;font-weight:700;}
  .topbar .sub{font-size:11px;opacity:0.85;}
  .icon-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px;}

  /* ---- tab nav ---- */
  .tabbar{
    display:flex;background:var(--surface);border-bottom:1px solid var(--border);
    overflow-x:auto;position:sticky;top:58px;z-index:9;
  }
  .tabbar button{
    flex:1;min-width:70px;border:none;background:none;padding:10px 4px;font-size:11px;
    color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tabbar button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}

  .content{padding:14px;flex:1;padding-bottom:40px;}

  /* ---- generic components ---- */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:12px;
  }
  .banner{
    background:var(--banner-bg);border:1px solid var(--banner-border);color:var(--banner-text);border-radius:10px;
    padding:10px 12px;font-size:12px;margin-bottom:14px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-value{font-size:18px;font-weight:800;color:var(--text);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:2px;}
  h2.section-title{font-size:14px;font-weight:800;margin:16px 0 8px;}
  label.field-label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;}
  input[type=text],input[type=password],input[type=number],input[type=tel],select,textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);font-size:14px;color:var(--text);

    display:inline-block;width:100%;text-align:center;background:var(--primary);color:#fff;
    border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;
  }
  .btn.secondary{background:var(--muted);}
  .btn.danger{background:var(--danger);}
  .btn.success{background:var(--success);}
  .btn.outline{background:none;border:1px solid var(--primary);color:var(--primary);}
  .btn.small{width:auto;padding:8px 12px;font-size:12px;margin-top:0;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .chip{
    display:inline-block;padding:6px 12px;border-radius:20px;background:var(--surface);
    border:1px solid var(--border);font-size:12px;margin-right:6px;margin-bottom:6px;cursor:pointer;
  }
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;}
  .badge.paid{background:#E3F2E5;color:var(--success);}
  .badge.pending{background:#FFF3D6;color:var(--warning);}
  .badge.overdue{background:#FBE1E1;color:var(--danger);}
  .list-row{
    display:flex;align-items:center;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid var(--border);font-size:13px;
  }
  .list-row:last-child{border-bottom:none;}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:10px;
  }
  .muted{color:var(--muted);font-size:11px;}
  .empty-state{text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}
  .fab{
    position:fixed;bottom:20px;right:calc(50% - 220px + 20px);width:52px;height:52px;border-radius:50%;
    background:var(--primary);color:#fff;font-size:24px;border:none;box-shadow:0 4px 10px rgba(0,0,0,0.25);
    cursor:pointer;z-index:20;
  }
  @media (max-width:480px){ .fab{right:20px;} }
  .creds-box{background:var(--creds-bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;}
  .creds-box .k{font-size:11px;color:var(--muted);margin-top:8px;}
  .creds-box .v{font-size:16px;font-weight:800;color:var(--text);}
  .chat-bubble-wrap{display:flex;margin-bottom:10px;}
  .chat-bubble{max-width:75%;padding:9px 12px;border-radius:14px;font-size:13px;}
  .chat-bubble.mine{background:var(--primary);color:#fff;margin-left:auto;}
  .chat-bubble.other{background:var(--surface);border:1px solid var(--border);}
  .chat-sender{font-size:10px;font-weight:800;color:var(--primary);margin-bottom:2px;}
  .chat-img{max-width:100%;border-radius:8px;margin-top:4px;}
  .chat-input-row{
    display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--surface);
    position:sticky;bottom:0;
  }
  .chat-input-row input[type=text]{flex:1;}
  .login-wrap{padding:40px 24px;text-align:center;}
  .login-logo{
    width:76px;height:76px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;
    font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  }
  table.demo-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:10px;}
  table.demo-table th,table.demo-table td{border:1px solid var(--border);padding:5px 6px;text-align:left;}
  table.demo-table th{background:var(--table-head);}
  .toggle-link{font-size:12px;color:var(--primary);cursor:pointer;margin-top:16px;display:inline-block;}
  .code-note{font-size:11px;color:var(--muted);background:var(--table-head);border-radius:8px;padding:8px 10px;margin-top:10px;}
  .theme-toggle{
    background:rgba(255,255,255,0.18);border:none;color:#fff;font-size:16px;cursor:pointer;
    padding:6px 9px;border-radius:8px;margin-right:2px;
  }
  /* -------- Money rain splash animation (shown briefly when the app opens) -------- */
  .money-rain-container{
    position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;
  }
  .money-drop{
    position:absolute;top:-60px;will-change:transform,opacity;
    animation-name:moneyFall;animation-timing-function:ease-in;animation-fill-mode:forwards;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  @keyframes moneyFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(115vh) rotate(360deg);opacity:0.85;}
  }
</style>

<div id="app"></div>

<!-- Firebase (used only for cross-device cloud sync — see the "CLOUD SYNC
     (FIREBASE)" comment block inside the script below for setup steps).
     Loading these is harmless even if you never fill in a config: the app
     just falls back to local-only mode. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================================
   GROUP FINANCE MANAGER
   =========================================================================
   This single HTML file runs the FULL app UI/logic in the browser using an
   in-memory JavaScript object as the "database" (see DB below). By default
   (no Firebase config filled in) data lives only in this browser tab and
   resets on reload — a zero-setup demo mode.

   Fill in FIREBASE_CONFIG (see the "CLOUD SYNC (FIREBASE)" block further
   down) to make data persistent AND shared live across every device.
   ========================================================================= */

/* ------------------------------- UTILITIES ------------------------------- */
function fmt(n){ return "₹" + Math.round(n||0).toLocaleString("en-IN"); }
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

/* -------------------------- LATE PENALTY CONFIG --------------------------- */
// Monthly contribution must be deposited between the 1st and 5th of the month.
// Anything deposited from the 6th onward attracts a flat penalty, which gets
// folded straight into the contribution amount (not tracked as a separate due).
const CONTRIBUTION_AMOUNT = 2000;
const PENALTY_AMOUNT = 50;
const PENALTY_DEADLINE_DAY = 5; // deposit on/before this date-of-month = on time
function isPastPenaltyDeadline(d){
  d = d ? new Date(d) : new Date();
  return d.getDate() > PENALTY_DEADLINE_DAY;
}
function currentMonthLabel(){ return new Date().toLocaleString("default",{month:"long",year:"numeric"}); }

/* REDUCING BALANCE METHOD (equal monthly principal + interest-on-remaining-balance)
   ------------------------------------------------------------------------------
   Every month the borrower pays a FIXED principal installment (principal / months),
   plus interest calculated fresh on whatever balance is STILL OUTSTANDING that
   month (balance * monthlyRate). Since the balance shrinks every month, the
   interest portion shrinks too -> the total monthly payment goes DOWN over time.
   This is the standard method used by group lending / chit-fund style societies,
   and is different from a fixed bank EMI (where the total payment stays constant
   but the interest/principal split shifts internally). */
function buildSchedule(principal, monthlyRatePercent, months, startDate){
  const r = monthlyRatePercent/100;
  const monthlyPrincipal = round2(principal/months);
  let balance = principal;
  const schedule = [];
  for(let m=1; m<=months; m++){
    const interestForMonth = round2(balance*r);
    let principalForMonth = monthlyPrincipal;
    if(m===months) principalForMonth = round2(balance); // last month clears any rounding remainder
    const payment = round2(principalForMonth + interestForMonth);
    balance = round2(balance - principalForMonth);
    if(balance<0) balance = 0;
    const due = new Date(startDate);
    due.setMonth(due.getMonth()+m);
    schedule.push({
      month:m, emi:payment, principalPaid:principalForMonth, interestPaid:interestForMonth,
      balance, dueDate:due.toISOString(), status:"Pending", proofUrl:null
    });
  }
  return schedule;
}
function totalInterestPayable(principal, rate, months){
  const schedule = buildSchedule(principal, rate, months, new Date());
  return round2(schedule.reduce((s,e)=>s+e.interestPaid,0));
}
function generateUserId(seq){ return "GFM-" + String(seq).padStart(4,"0"); }
function generateTempPassword(){
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ", digits="0123456789";
  let p="";
  for(let i=0;i<4;i++) p += letters[Math.floor(Math.random()*letters.length)];
  for(let i=0;i<4;i++) p += digits[Math.floor(Math.random()*digits.length)];
  return p;
}
function normalizeMobile(m){ return String(m).replace(/[^0-9]/g,""); }
function isOverdue(dueIso){ return new Date(dueIso) < new Date(); }
function timeNow(){ return new Date().toISOString(); }
function buildWhatsAppLink(mobile, message){
  const clean = normalizeMobile(mobile);
  const intlMobile = clean.length===10 ? "91"+clean : clean;
  return `https://wa.me/${intlMobile}?text=${encodeURIComponent(message)}`;
}
function credentialsWhatsAppMessage(name, userId, mobile, password){
  return `Hi ${name}, here are your Group Finance Manager login details:\nUser ID: ${userId}\nMobile: ${mobile}\nPassword: ${password}\n\nPlease login and change your password after your first login.`;
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* --------------------------------- DATA LAYER --------------------------------
   In-memory "DB". Each function below is the single place that touches DB,
   so swapping to Firebase later = rewriting just these functions (the UI
   code calls DB.xxx(...) and doesn't care how it's implemented).
-------------------------------------------------------------------------- */
const DB = {
  users: [],            // {uid, userId, name, mobile, password, role}
  members: {},          // uid -> {uid, userId, name, mobile, totalDeposit, remainingBalance, activeLoanId}
  loans: {},            // loanId -> {id, memberUid, principal, interestRate, durationMonths, emi, totalInterest, interestCollectedSoFar, status, startDate}
  schedules: {},        // loanId -> [ {month, emi, principalPaid, interestPaid, balance, dueDate, status, proofUrl} ]
  contributions: [],    // {id, memberUid, amount, baseAmount, penalty, month, paidAt, proofUrl}
  submissions: [],      // {id, memberUid, type, loanId, month, proofUrl(base64), status, submittedAt}
  chat: [],             // {id, senderUid, senderName, text, imageUrl(base64), createdAt}
  loanPayments: [],     // {id, loanId, memberUid, amount, interestPortion, principalPortion, balanceAfter, paidAt, closedLoan}
  manualInterestPayments: [], // {id, loanId, memberUid, amount, note, paidAt} — extra/out-of-schedule interest recorded manually
  settings: {
    defaultInterestRate: 2,
    bankDetails: { accountHolder:"", bankName:"", accountNumber:"", ifsc:"", upi:"", qrImage:null }
  },
  memberSeq: 0,
  adminSeq: 1,
};

// FIREBASE: replace body with `createUserWithEmailAndPassword` + Firestore setDoc calls (see firestoreService.js in the full source bundle)
// FIREBASE: replace body with `createUserWithEmailAndPassword` + Firestore setDoc calls (see firestoreService.js in the full source bundle)
function dbAddAdmin(name, mobile){
  const clean = normalizeMobile(mobile);
  if(DB.users.some(u=>u.mobile===clean)){ return { error:"A user with this mobile number already exists." }; }
  DB.adminSeq += 1;
  const seq = DB.adminSeq;
  const userId = "ADM-" + String(seq).padStart(4,"0");
  const tempPassword = generateTempPassword();
  const newUid = uid("adm");
  DB.users.push({ uid:newUid, userId, name, mobile:clean, password:tempPassword, role:"admin" });
  // Admins are also tracked as members (contributions/loans) exactly like everyone else.
  DB.members[newUid] = { uid:newUid, userId, name, mobile:clean, totalDeposit:0, remainingBalance:0, activeLoanId:null, paymentDetails:{ accountHolder:"", bankName:"", accountNumber:"", ifsc:"", upi:"", qrImage:null } };
  return { uid:newUid, userId, mobile:clean, tempPassword };
}
function dbListAdmins(){ return DB.users.filter(u=>u.role==="admin"); }
function dbRemoveAdmin(adminUid){
  if(dbListAdmins().length<=1) return { error:"At least one admin must remain." };
  const idx = DB.users.findIndex(u=>u.uid===adminUid);
  if(idx>=0) DB.users.splice(idx,1);
  delete DB.members[adminUid];
  return { ok:true };
}
function dbChangePassword(userUid, oldPassword, newPassword){
  const u = DB.users.find(x=>x.uid===userUid);
  if(!u) return { error:"User not found." };
  if(u.password !== oldPassword) return { error:"Current password is incorrect." };
  if(!newPassword || newPassword.length<4) return { error:"New password must be at least 4 characters." };
  u.password = newPassword;
  return { ok:true };
}
function dbAddMember(name, mobile){
  DB.memberSeq += 1;
  const seq = DB.memberSeq;
  const clean = normalizeMobile(mobile);
  const userId = generateUserId(seq);
  const tempPassword = generateTempPassword();
  const newUid = uid("mem");
  DB.users.push({ uid:newUid, userId, name, mobile:clean, password:tempPassword, role:"member" });
  DB.members[newUid] = { uid:newUid, userId, name, mobile:clean, totalDeposit:0, remainingBalance:0, activeLoanId:null, paymentDetails:{ accountHolder:"", bankName:"", accountNumber:"", ifsc:"", upi:"", qrImage:null } };
  return { uid:newUid, userId, mobile:clean, tempPassword };
}
// FIREBASE: replace with updateDoc() on users/{uid} and members/{uid}
function dbEditMember(memberUid, name, mobile){
  const u = DB.users.find(x=>x.uid===memberUid);
  const m = DB.members[memberUid];
  const clean = normalizeMobile(mobile);
  if(DB.users.some(x=>x.uid!==memberUid && x.mobile===clean)){
    return { error:"Another user already has this mobile number." };
  }
  if(u){ u.name=name; u.mobile=clean; }
  if(m){ m.name=name; m.mobile=clean; }
  return { ok:true };
}
// Promote a member to admin (keeps the same uid/history/contributions/loans — just the role & access level change).
function dbPromoteToAdmin(memberUid){
  const u = DB.users.find(x=>x.uid===memberUid);
  if(!u) return { error:"User not found." };
  if(u.role==="admin") return { ok:true };
  if(dbListAdmins().length>=3) return { error:"Maximum of 3 admins reached." };
  u.role = "admin";
  // Login ID switches from GFM- to ADM- prefix now that this person has admin access.
  DB.adminSeq += 1;
  const newId = "ADM-" + String(DB.adminSeq).padStart(4,"0");
  u.userId = newId;
  const m = DB.members[memberUid];
  if(m) m.userId = newId;
  return { ok:true };
}
// Demote an admin back to a normal member (same safeguard as Manage Admins: one admin must always remain).
function dbDemoteToMember(memberUid){
  const u = DB.users.find(x=>x.uid===memberUid);
  if(!u) return { error:"User not found." };
  if(u.role==="member") return { ok:true };
  if(dbListAdmins().length<=1) return { error:"At least one admin must remain." };
  u.role = "member";
  // Login ID switches back from ADM- to GFM- prefix now that admin access is removed.
  DB.memberSeq += 1;
  const newId = generateUserId(DB.memberSeq);
  u.userId = newId;
  const m = DB.members[memberUid];
  if(m) m.userId = newId;
  return { ok:true };
}
// Admins listed first (in admin order), then regular members — used everywhere a members list is shown.
function sortMembersAdminsFirst(list){
  return list.slice().sort((a,b)=>{
    const au = DB.users.find(x=>x.uid===a.uid);
    const bu = DB.users.find(x=>x.uid===b.uid);
    const aAdmin = au && au.role==="admin" ? 0 : 1;
    const bAdmin = bu && bu.role==="admin" ? 0 : 1;
    if(aAdmin!==bAdmin) return aAdmin-bAdmin;
    return (a.userId||"").localeCompare(b.userId||"");
  });
}
// Small inline Call + WhatsApp icons — dropped in wherever a mobile number is shown so
// admins/members can reach out directly without copying the number elsewhere.
function contactIcons(mobile, name){
  const clean = normalizeMobile(mobile);
  const waMsg = `Hi ${name||""}`.trim();
  return `<a href="tel:${clean}" onclick="event.stopPropagation();" title="Call" style="margin-left:10px;text-decoration:none;">📞</a><a href="${buildWhatsAppLink(mobile, waMsg)}" target="_blank" rel="noopener" onclick="event.stopPropagation();" title="WhatsApp" style="margin-left:8px;text-decoration:none;">💬</a>`;
}
// FIREBASE: replace with deleteDoc() on users/{uid} and members/{uid} (+ Cloud Function to delete Auth user)
function dbDeleteMember(memberUid){
  const u = DB.users.find(x=>x.uid===memberUid);
  if(u && u.role==="admin" && dbListAdmins().length<=1){
    return { error:"At least one admin must remain — can't remove the last admin." };
  }
  DB.users = DB.users.filter(x=>x.uid!==memberUid);
  delete DB.members[memberUid];
  return { ok:true };
}
// FIREBASE: replace with a Firestore query on 'members' collection
function dbListMembers(){ return Object.values(DB.members); }

// FIREBASE: replace with addDoc() to 'loans' + writing schedule subcollection docs
function dbGiveLoan(memberUid, principal, interestRate, durationMonths){
  const loanId = uid("loan");
  const startDate = timeNow();
  const schedule = buildSchedule(principal, interestRate, durationMonths, startDate);
  const totalInterest = round2(schedule.reduce((s,e)=>s+e.interestPaid,0));
  const monthlyPrincipal = round2(principal/durationMonths);
  DB.loans[loanId] = {
    id:loanId, memberUid, principal, interestRate, durationMonths,
    monthlyPrincipal, firstPayment:schedule[0].emi, lastPayment:schedule[schedule.length-1].emi,
    totalInterest, interestCollectedSoFar:0, status:"Active", startDate
  };
  DB.schedules[loanId] = schedule;
  DB.members[memberUid].activeLoanId = loanId;
  DB.members[memberUid].remainingBalance = principal;
  return DB.loans[loanId];
}
function dbGetActiveLoan(memberUid){
  return Object.values(DB.loans).find(l=>l.memberUid===memberUid && l.status==="Active") || null;
}
function dbListLoans(){ return Object.values(DB.loans); }
function dbGetSchedule(loanId){ return DB.schedules[loanId] || []; }

// A loan can only be safely edited/deleted while completely untouched — no EMI marked
// paid, no manual interest recorded, no custom/partial payments made against it yet.
// Once any money has moved against a loan, editing it would corrupt the member's
// balances and history, so we block it and point the admin at recording a payment instead.
function dbLoanIsUntouched(loanId){
  const loan = DB.loans[loanId];
  if(!loan) return false;
  const schedule = DB.schedules[loanId] || [];
  const allPending = schedule.every(s=>s.status==="Pending");
  const noInterest = (loan.interestCollectedSoFar||0) === 0;
  const noManualInterest = !DB.manualInterestPayments.some(p=>p.loanId===loanId);
  const noCustomPayments = !DB.loanPayments.some(p=>p.loanId===loanId);
  return allPending && noInterest && noManualInterest && noCustomPayments;
}
// FIREBASE: replace with updateDoc() on loans/{id} + rewriting the schedule subcollection
function dbEditLoan(loanId, principal, interestRate, durationMonths){
  const loan = DB.loans[loanId];
  if(!loan) return { error:"Loan not found." };
  if(!dbLoanIsUntouched(loanId)) return { error:"Can't edit this loan — one or more payments have already been recorded against it. Record a payment or contact support to correct it instead." };
  const startDate = loan.startDate;
  const schedule = buildSchedule(principal, interestRate, durationMonths, startDate);
  const totalInterest = round2(schedule.reduce((s,e)=>s+e.interestPaid,0));
  const monthlyPrincipal = round2(principal/durationMonths);
  Object.assign(loan, { principal, interestRate, durationMonths, monthlyPrincipal, firstPayment:schedule[0].emi, lastPayment:schedule[schedule.length-1].emi, totalInterest });
  DB.schedules[loanId] = schedule;
  const member = DB.members[loan.memberUid];
  if(member) member.remainingBalance = principal;
  return { ok:true };
}
// FIREBASE: replace with deleteDoc() on loans/{id} + the schedule subcollection
function dbDeleteLoan(loanId){
  const loan = DB.loans[loanId];
  if(!loan) return { error:"Loan not found." };
  if(!dbLoanIsUntouched(loanId)) return { error:"Can't delete this loan — one or more payments have already been recorded against it." };
  const member = DB.members[loan.memberUid];
  if(member && member.activeLoanId===loanId){ member.activeLoanId=null; member.remainingBalance=0; }
  delete DB.loans[loanId];
  delete DB.schedules[loanId];
  return { ok:true };
}

// FIREBASE: replace with updateDoc() on the schedule entry + members/{uid}
function dbMarkEmiPaid(loanId, month, proofUrl){
  const sched = DB.schedules[loanId];
  const entry = sched.find(s=>s.month===month);
  if(!entry) return;
  entry.status = "Paid"; entry.proofUrl = proofUrl || null; entry.paidAt = timeNow();
  const loan = DB.loans[loanId];
  loan.interestCollectedSoFar = round2((loan.interestCollectedSoFar||0) + entry.interestPaid);
  DB.members[loan.memberUid].remainingBalance = entry.balance;
  if(entry.balance<=0){ loan.status="Closed"; loan.closedDate=timeNow(); DB.members[loan.memberUid].activeLoanId=null; }
}

// FIREBASE: replace with addDoc() to 'loanPayments' + updateDoc() on loans/{id} and members/{uid}
// Handles a CUSTOM amount received any time (partial pre-payment or full foreclosure).
// Interest is charged fresh on whatever is still outstanding, then the rest reduces principal.
// If that clears the balance, the loan closes immediately and an NOC becomes available.
function dbRecordLoanPayment(loanId, amount, proofUrl){
  const loan = DB.loans[loanId];
  if(!loan || loan.status!=="Active") return null;
  const member = DB.members[loan.memberUid];
  const schedule = DB.schedules[loanId];
  const r = loan.interestRate/100;
  const outstanding = member.remainingBalance;
  const interestDue = round2(outstanding*r);
  const interestPortion = round2(Math.min(amount, interestDue));
  let principalPortion = round2(amount - interestPortion);
  if(principalPortion > outstanding) principalPortion = outstanding;
  if(principalPortion < 0) principalPortion = 0;
  const newBalance = round2(outstanding - principalPortion);

  const payment = {
    id: uid("pay"), loanId, memberUid: loan.memberUid, amount: round2(amount),
    interestPortion, principalPortion, balanceAfter:newBalance,
    paidAt: timeNow(), proofUrl: proofUrl||null, closedLoan:false
  };
  loan.interestCollectedSoFar = round2((loan.interestCollectedSoFar||0) + interestPortion);

  if(newBalance<=0){
    schedule.forEach(s=>{ if(s.status!=="Paid") s.status = "Waived"; });
    loan.status = "Closed";
    loan.closedDate = timeNow();
    loan.closedEarly = true;
    member.activeLoanId = null;
    member.remainingBalance = 0;
    payment.closedLoan = true;
  } else {
    member.remainingBalance = newBalance;
    // Re-amortize the still-pending months over the new, smaller balance
    const pendingEntries = schedule.filter(s=>s.status!=="Paid");
    const remainingMonths = pendingEntries.length;
    if(remainingMonths>0){
      let balance = newBalance;
      const newMonthlyPrincipal = round2(newBalance/remainingMonths);
      pendingEntries.forEach((entry,idx)=>{
        const interestForMonth = round2(balance*r);
        let principalForMonth = newMonthlyPrincipal;
        if(idx===remainingMonths-1) principalForMonth = round2(balance);
        entry.emi = round2(principalForMonth+interestForMonth);
        entry.principalPaid = principalForMonth;
        entry.interestPaid = interestForMonth;
        balance = round2(balance-principalForMonth);
        if(balance<0) balance = 0;
        entry.balance = balance;
      });
      loan.monthlyPrincipal = newMonthlyPrincipal;
    }
  }
  DB.loanPayments.push(payment);
  return payment;
}
function dbListLoanPayments(loanId){ return DB.loanPayments.filter(p=>p.loanId===loanId).sort((a,b)=> new Date(b.paidAt)-new Date(a.paidAt)); }

// FIREBASE: replace with addDoc() to 'contributions' + updateDoc() on members/{uid}.totalDeposit
// `penalty` (if any) is added straight into the stored amount — the member's total
// deposit reflects base + penalty as one figure, with the breakdown kept on the

function dbRecordContribution(memberUid, amount, month, proofUrl, penalty){

}

// FIREBASE: replace with updateDoc() on contributions/{id} + adjusting members/{uid}.totalDeposit by the delta
function dbEditContribution(id, amount, month, penalty){
  const c = DB.contributions.find(x=>x.id===id);
  if(!c) return { error:"Contribution not found." };
  penalty = round2(penalty||0);
  const newTotal = round2((amount||0) + penalty);
  const oldTotal = c.amount;
  const member = DB.members[c.memberUid];
  if(member) member.totalDeposit = round2((member.totalDeposit||0) - oldTotal + newTotal);
  c.baseAmount = round2(amount||0); c.penalty = penalty; c.amount = newTotal; c.month = month;
  return { ok:true };
}
// FIREBASE: replace with deleteDoc() on contributions/{id} + adjusting members/{uid}.totalDeposit
function dbDeleteContribution(id){

}

function dbAllTransactions(){
  const contribs = DB.contributions.map(c=>({ id:c.id, type:"Contribution", memberUid:c.memberUid, amount:c.amount, month:c.month+(c.penalty?` (incl. ${fmt(c.penalty)} penalty)`:""), paidAt:c.paidAt }));
  let emis = [];
  Object.values(DB.loans).forEach(loan=>{
    (DB.schedules[loan.id]||[]).filter(s=>s.status==="Paid").forEach(s=>{
      emis.push({ id:loan.id+"-"+s.month, type:"EMI Payment", memberUid:loan.memberUid, amount:s.emi, month:"Month "+s.month, paidAt:s.paidAt });
    });
  });
  const customPays = DB.loanPayments.map(p=>({ id:p.id, type:p.closedLoan?"Loan Closure Payment":"Loan Payment (Partial)", memberUid:p.memberUid, amount:p.amount, month:`Interest ${fmt(p.interestPortion)} + Principal ${fmt(p.principalPortion)}`, paidAt:p.paidAt }));
  const manualInterest = DB.manualInterestPayments.map(p=>({ id:p.id, type:"Manual Interest Payment", memberUid:p.memberUid, amount:p.amount, month:p.note||"—", paidAt:p.paidAt }));
  return [...contribs, ...emis, ...customPays, ...manualInterest].sort((a,b)=> new Date(b.paidAt)-new Date(a.paidAt));
}
function dbDashboardTotals(){
  const members = dbListMembers();
  const loans = dbListLoans();
  let pending = 0;
  loans.forEach(l=> (DB.schedules[l.id]||[]).forEach(s=>{ if(s.status!=="Paid") pending++; }));
  return {
    totalCollection: round2(members.reduce((s,m)=>s+(m.totalDeposit||0),0)),
    totalLoansGiven: round2(loans.reduce((s,l)=>s+(l.principal||0),0)),
    totalInterestEarned: round2(loans.reduce((s,l)=> s + (l.status==="Closed" ? l.totalInterest : (l.interestCollectedSoFar||0)), 0)),
    pendingRepayments: pending,
  };
}
// The group's actual cash-in-hand: every rupee contributed by members, plus every rupee of
// principal & interest that has come back from loans already disbursed, minus every rupee of
// principal that has gone OUT the door as loans (whether that loan is still active or closed).
// A new loan can never be larger than this, since you can't lend money the group doesn't have.
function dbAvailableBankBalance(){
  const totalContributions = round2(dbListMembers().reduce((s,m)=>s+(m.totalDeposit||0),0));
  const loans = dbListLoans();
  const totalDisbursed = round2(loans.reduce((s,l)=>s+l.principal,0));
  let totalPrincipalRepaid = 0;
  let totalInterestReceived = 0;
  loans.forEach(l=>{
    totalInterestReceived += (l.interestCollectedSoFar||0);
    (DB.schedules[l.id]||[]).forEach(s=>{ if(s.status==="Paid") totalPrincipalRepaid += s.principalPaid; });
  });
  DB.loanPayments.forEach(p=> totalPrincipalRepaid += p.principalPortion);
  totalPrincipalRepaid = round2(totalPrincipalRepaid);
  totalInterestReceived = round2(totalInterestReceived);
  const available = round2(totalContributions + totalPrincipalRepaid + totalInterestReceived - totalDisbursed);
  return { available: Math.max(0,available), totalContributions, totalDisbursed, totalPrincipalRepaid, totalInterestReceived };
}

   ===========================================================================
   Without this filled in, the app behaves exactly as before: everything

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDt-B9hVdDcuaoORkt797J4jZqigZ3spC4",
  authDomain: "kuber-group-finance.firebaseapp.com",
  projectId: "kuber-group-finance",

};
const CLOUD_SYNC_ENABLED = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" && typeof firebase !== "undefined";

let cloudDocRef = null;
let applyingRemoteUpdate = false;
let cloudSaveTimer = null;

// Debounced push of the whole in-memory DB up to Firestore. Called at the
// top of every render() — since this app already calls render() after every
// mutation, this one hook is enough to keep the cloud copy up to date.
function scheduleCloudSave(){
  if(!CLOUD_SYNC_ENABLED || !cloudDocRef || applyingRemoteUpdate) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>{
    cloudDocRef.set(DB).catch(err=>console.error("Cloud save failed:", err));
  }, 500);
}

// Replace the local DB's contents (in place — DB is a const) with whatever
// just arrived from Firestore, from this device or any other.
function applyCloudSnapshot(data){
  applyingRemoteUpdate = true;
  DB.users = data.users || [];
  DB.members = data.members || {};
  DB.loans = data.loans || {};
  DB.schedules = data.schedules || {};
  DB.contributions = data.contributions || [];
  DB.submissions = data.submissions || [];
  DB.chat = data.chat || [];
  DB.loanPayments = data.loanPayments || [];
  DB.manualInterestPayments = data.manualInterestPayments || [];
  DB.settings = data.settings || DB.settings;
  DB.memberSeq = data.memberSeq || 0;
  DB.adminSeq = data.adminSeq || 1;
  applyingRemoteUpdate = false;
}

function startApp(){
  if(!CLOUD_SYNC_ENABLED){
    seed();
    backfillAdminMembers();
    backfillAdminIds();
    restoreSession();
    render();
    maybeShowMoneyRain();
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const authClient = firebase.auth();
  cloudDocRef = firebase.firestore().collection("gfm-app").doc("data");

  authClient.onAuthStateChanged(user=>{
    if(!user) return;
    cloudDocRef.onSnapshot(snap=>{
      if(snap.exists){
        applyCloudSnapshot(snap.data());
        backfillAdminMembers();
        backfillAdminIds();
      } else {
        seed();
        backfillAdminMembers();
        backfillAdminIds();
        cloudDocRef.set(DB).catch(err=>console.error("Initial cloud write failed:", err));
      }
      restoreSession();
      render();
      maybeShowMoneyRain();
    }, err=>{
      console.error("Cloud sync error:", err);
      root.innerHTML = `<div class="empty-state">⚠️ Could not connect to the cloud database. Check your Firebase config / Firestore rules, or your internet connection.</div>`;
    });
  });

  authClient.signInAnonymously().catch(err=>{
    console.error("Anonymous sign-in failed:", err);
    seed(); backfillAdminMembers(); backfillAdminIds(); restoreSession(); render(); maybeShowMoneyRain();
  });
}

/* ---- SESSION PERSISTENCE: keep the user logged in across page refreshes ---- */
const SESSION_KEY = "gfm_session_uid";
function persistSession(){
  try{
    if(state.currentUid) localStorage.setItem(SESSION_KEY, state.currentUid);
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){ /* localStorage unavailable — session just won't survive a refresh */ }
}
function restoreSession(){
  try{
    const saved = localStorage.getItem(SESSION_KEY);
    if(saved){
      const u = DB.users.find(x=>x.uid===saved);
      if(u){
        state.currentUid = saved;
        state.view = u.role==="admin" ? "admin-dashboard" : "member-dashboard";
      } else {
        localStorage.removeItem(SESSION_KEY); // stale session (user no longer exists)
      }
    }
  }catch(e){ /* ignore */ }
}

    </div>

  `;
}

function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);

}

  <div class="muted" style="margin-bottom:10px;">${editing ? "Correct the amount, penalty, or label of this contribution." : "Use this when a member has deposited their contribution outside the app (cash, bank transfer, UPI without proof upload) and you want to record it directly — with or without a late penalty."}</div>
  <label class="field-label">Member</label>
  <select id="manualContribMember" ${editing?"disabled":""}>
    ${members.map(m=>`<option value="${m.uid}" ${(editing?editing.memberUid:state.selectedMemberUid)===m.uid?"selected":""}>${m.name} (${m.userId})</option>`).join("")}
  </select>
  <label class="field-label">Month / Label</label>
  <input type="text" id="manualContribMonth" value="${editing?editing.month:currentMonthLabel()}" />
  <label class="field-label">Contribution Amount (₹)</label>

  <label class="field-label">Penalty (₹) <span class="muted" style="font-weight:400;">— set 0 if paid on time</span></label>
  <input type="number" id="manualContribPenalty" value="${editing?editing.penalty:suggestedPenalty}" />
  ${!editing && suggestedPenalty ? `<div class="muted" style="font-size:11px;margin-top:-4px;">Suggested because today is past the ${PENALTY_DEADLINE_DAY}th of the month — edit or clear if it doesn't apply.</div>` : ""}
  <button class="btn" style="margin-top:14px;" onclick="submitManualContribution(${editing?`'${editing.id}'`:"null"})">${editing ? "Save Changes" : "Save Contribution"}</button>
  <button class="btn secondary" onclick="go(${editing?`'admin-member-detail',{selectedMemberUid:'${editing.memberUid}'}`:`'admin-dashboard'`})">Cancel</button>`;
}
function submitManualContribution(editingId){
  const memberUid = document.getElementById("manualContribMember").value;
  const month = document.getElementById("manualContribMonth").value.trim() || currentMonthLabel();
  const amount = parseFloat(document.getElementById("manualContribAmount").value);
  const penalty = parseFloat(document.getElementById("manualContribPenalty").value) || 0;
  if(!memberUid){ alert("Please select a member."); return; }
  if(!amount || amount<0){ alert("Please enter a valid contribution amount."); return; }
  if(editingId){
    const res = dbEditContribution(editingId, amount, month, penalty);
    if(res && res.error){ alert(res.error); return; }
  } else {
    dbRecordContribution(memberUid, amount, month, null, penalty);
  }
  go("admin-member-detail", {selectedMemberUid:memberUid});
}
function deleteContribution(id, memberUid){
  if(!confirm("Delete this contribution entry? This will also reduce the member's total deposit.")) return;
  const res = dbDeleteContribution(id);
  if(res && res.error){ alert(res.error); return; }
  render();
}

function viewAddManualInterest(){
  const editing = state.editingInterestId ? DB.manualInterestPayments.find(p=>p.id===state.editingInterestId) : null;
  const loans = editing ? dbListLoans() : dbListLoans().filter(l=>l.status==="Active");
  return `
  <h2 class="section-title" style="margin-top:0;">${editing ? "Edit Interest Payment" : "Add Loan Interest Payment (Manual)"}</h2>
  <div class="muted" style="margin-bottom:10px;">${editing ? "Correct the amount or note of this manual interest entry." : "Use this to record extra / out-of-schedule interest received on a member's active loan (separate from the regular EMI schedule)."}</div>
  ${loans.length ? `
  <label class="field-label">Member / Loan</label>
  <select id="manualInterestLoan" ${editing?"disabled":""}>
    ${loans.map(l=>{ const mm=DB.members[l.memberUid]; return `<option value="${l.id}" ${(editing?editing.loanId:null)===l.id || (!editing && state.selectedMemberUid===l.memberUid) ? "selected":""}>${mm?mm.name:"Unknown"} — ${fmt(l.principal)} loan</option>`; }).join("")}
  </select>
  <label class="field-label">Interest Amount (₹)</label>
  <input type="number" id="manualInterestAmount" value="${editing?editing.amount:""}" placeholder="e.g. 500" />
  <label class="field-label">Note (optional)</label>
  <input type="text" id="manualInterestNote" value="${editing?(editing.note||""):""}" placeholder="e.g. Extra interest for delayed payment" />
  <button class="btn" style="margin-top:14px;" onclick="submitManualInterest(${editing?`'${editing.id}'`:"null"})">${editing ? "Save Changes" : "Save Interest Payment"}</button>
  <button class="btn secondary" onclick="go(${editing?`'admin-member-detail',{selectedMemberUid:'${editing.memberUid}'}`:`'admin-dashboard'`})">Cancel</button>
  ` : `<div class="empty-state">No active loans right now.</div><button class="btn secondary" style="margin-top:10px;" onclick="go('admin-dashboard')">Back</button>`}`;
}
function submitManualInterest(editingId){
  const amount = parseFloat(document.getElementById("manualInterestAmount").value);
  const note = document.getElementById("manualInterestNote").value.trim();
  if(!amount || amount<=0){ alert("Please enter a valid interest amount."); return; }
  if(editingId){
    const entry = DB.manualInterestPayments.find(p=>p.id===editingId);
    const res = dbEditManualInterest(editingId, amount, note);
    if(res && res.error){ alert(res.error); return; }
    go("admin-member-detail", {selectedMemberUid:entry.memberUid});
  } else {
    const loanId = document.getElementById("manualInterestLoan").value;
    const loan = DB.loans[loanId];
    if(!loan) return;
    dbRecordManualInterest(loan.memberUid, loanId, amount, note);
    go("admin-member-detail", {selectedMemberUid:loan.memberUid});
  }
}
function deleteManualInterest(id, memberUid){
  if(!confirm("Delete this interest entry? This will also reduce the loan's interest collected total.")) return;
  const res = dbDeleteManualInterest(id);
  if(res && res.error){ alert(res.error); return; }
  render();
}

function approveSubmission(id){
  const s = dbResolveSubmission(id, true);
  if(s.type==="EMI") dbMarkEmiPaid(s.loanId, s.month, s.proofUrl);
  else{
    const base = s.amount || CONTRIBUTION_AMOUNT;
    const penalty = isPastPenaltyDeadline(s.submittedAt) ? PENALTY_AMOUNT : 0;
    dbRecordContribution(s.memberUid, base, s.month, s.proofUrl, penalty);
  }
  render();
}
function rejectSubmission(id){ dbResolveSubmission(id, false); render(); }

function renderMembersListOnly(){

function confirmDeleteMember(uidVal,name){
  if(confirm(`Remove ${name}? This deletes their login. History is preserved.`)){
    const res = dbDeleteMember(uidVal);
    if(res && res.error){ alert(res.error); return; }
    if(state.view==="admin-member-detail") go("admin-members"); else render();
  }
}
function changeRole(uidVal, newRole, name){
  const msg = newRole==="admin"
    ? `Make ${name} an admin? They'll get full admin access (same power as you), while keeping all their existing contribution/loan history.`
    : `Make ${name} a normal member? They'll lose admin access immediately, while keeping all their existing contribution/loan history.`;
  if(!confirm(msg)) return;
  const res = newRole==="admin" ? dbPromoteToAdmin(uidVal) : dbDemoteToMember(uidVal);
  if(res && res.error){ alert(res.error); return; }
  if(uidVal===currentUser().uid && newRole==="member"){
    state.view = "member-dashboard"; // demoting yourself — drop into the member view immediately
    render();
    return;
  }
  render();
}

function selectLoanMember(uidVal){ state.selectedMemberUid = uidVal; render(); }
function updateEmiPreview(){
  const p = parseFloat(document.getElementById("loanPrincipal").value);
  const r = parseFloat(document.getElementById("loanRate").value);
  const n = parseInt(document.getElementById("loanDuration").value,10);
  const el = document.getElementById("emiPreview");
  if(!p||!r||!n){ el.innerHTML=""; return; }
  const bank = dbAvailableBankBalance();
  const schedule = buildSchedule(p,r,n,new Date());
  const interest = round2(schedule.reduce((s,e)=>s+e.interestPaid,0));
  const monthlyPrincipal = round2(p/n);
  const totalPayable = round2(p+interest);
  const exceeds = p > bank.available;
  el.innerHTML = `
    ${exceeds ? `<div class="banner" style="background:#FBE1E1;border-color:#F0B0B0;color:var(--danger);">🚫 This exceeds the available bank balance (${fmt(bank.available)}). Reduce the loan amount.</div>` : ""}

      <div class="row-between" style="margin-top:6px;"><span class="muted">Last Month Payment (Principal ${fmt(schedule[n-1].principalPaid)} + Interest ${fmt(schedule[n-1].interestPaid)})</span><b>${fmt(schedule[n-1].emi)}</b></div>
      <div class="row-between" style="margin-top:6px;"><span class="muted">Total Interest</span><b>${fmt(interest)}</b></div>
      <div class="row-between" style="margin-top:6px;"><span class="muted">Total Payable</span><b>${fmt(totalPayable)}</b></div>
      <div class="muted" style="margin-top:8px;font-size:11px;">Payment amount reduces every month since interest is charged only on the remaining balance.</div>
    </div>`;
}
function submitLoan(){
  if(!state.selectedMemberUid){ alert("Please choose a member for this loan."); return; }
  if(dbGetActiveLoan(state.selectedMemberUid)){ alert("This member already has an active loan."); return; }
  const p = parseFloat(document.getElementById("loanPrincipal").value);
  const r = parseFloat(document.getElementById("loanRate").value);
  const n = parseInt(document.getElementById("loanDuration").value,10);
  if(!p||p<=0||!r||!n||n<=0){ alert("Please enter valid loan amount, interest rate, and duration."); return; }
  const bank = dbAvailableBankBalance();
  if(p > bank.available){ alert(`Cannot give this loan. Available bank balance is only ${fmt(bank.available)}, which is less than the requested ${fmt(p)}.`); return; }
  dbGiveLoan(state.selectedMemberUid, p, r, n);
  alert("Loan approved and EMI schedule generated.");
  go("admin-member-detail",{selectedMemberUid:state.selectedMemberUid});
}

  const m = DB.members[loan.memberUid];
  if(!dbLoanIsUntouched(loanId)){
    return `

    <div class="banner" style="background:#FBE1E1;border-color:#F0B0B0;color:var(--danger);">🚫 This loan can't be edited anymore — one or more EMI payments / interest / repayments have already been recorded against it. Editing now would corrupt ${m?m.name:"the member"}'s balance history.</div>
    <div class="muted" style="margin-top:8px;">If something was entered wrong, use "Make a Payment" or the loan interest / contribution tools to correct the balance going forward instead.</div>
    <button class="btn secondary" style="margin-top:14px;" onclick="go('admin-member-detail',{selectedMemberUid:'${loan.memberUid}'})">Back</button>`;
  }
  return `
  <h2 class="section-title" style="margin-top:0;">Edit Loan — ${m?m.name:""}</h2>
  <div class="muted" style="margin-bottom:10px;">No payments have been recorded on this loan yet, so it's safe to correct any mistakes.</div>
  <label class="field-label">Loan Amount (₹)</label>
  <input type="number" id="editLoanPrincipal" value="${loan.principal}" />
  <label class="field-label">Interest Rate (% per month)</label>
  <input type="number" id="editLoanRate" value="${loan.interestRate}" />
  <label class="field-label">Duration (months)</label>
  <input type="number" id="editLoanDuration" value="${loan.durationMonths}" />
  <button class="btn" style="margin-top:14px;" onclick="submitEditLoan('${loanId}')">Save Changes</button>
  <button class="btn secondary" onclick="go('admin-member-detail',{selectedMemberUid:'${loan.memberUid}'})">Cancel</button>`;
}
function submitEditLoan(loanId){
  const p = parseFloat(document.getElementById("editLoanPrincipal").value);
  const r = parseFloat(document.getElementById("editLoanRate").value);
  const n = parseInt(document.getElementById("editLoanDuration").value,10);
  if(!p||p<=0||!r||!n||n<=0){ alert("Please enter valid loan amount, interest rate, and duration."); return; }
  const loan = DB.loans[loanId];
  const memberUid = loan.memberUid;
  const bank = dbAvailableBankBalance();
  const availableIncludingThisLoan = round2(bank.available + loan.principal); // this loan's old amount is already subtracted from bank.available
  if(p > availableIncludingThisLoan){ alert(`Cannot set this amount. Available bank balance (including this loan's current amount) is only ${fmt(availableIncludingThisLoan)}.`); return; }
  const res = dbEditLoan(loanId, p, r, n);
  if(res && res.error){ alert(res.error); return; }
  go("admin-member-detail", {selectedMemberUid:memberUid});
}
function confirmDeleteLoan(loanId){
  const loan = DB.loans[loanId];
  if(!loan) return;
  if(!confirm("Delete this loan entirely? This can't be undone.")) return;
  const memberUid = loan.memberUid;
  const res = dbDeleteLoan(loanId);
  if(res && res.error){ alert(res.error); return; }
  go("admin-member-detail", {selectedMemberUid:memberUid});
}

/* ------------------------------ LOAN PAYMENTS -------------------------------- */
function recordCustomPayment(loanId){
  const input = document.getElementById("customPayAmount");
  const amt = parseFloat(input.value);
  if(!amt || amt<=0){ alert("Please enter a valid amount received."); return; }
  const payment = dbRecordLoanPayment(loanId, amt);
  if(!payment){ alert("Could not record this payment."); return; }
  if(payment.closedLoan){
    alert(`Payment recorded ✅\nInterest: ${fmt(payment.interestPortion)}  •  Principal: ${fmt(payment.principalPortion)}\n\nLoan fully closed! You can now download the NOC from the Loan History section below.`);
  } else {
    alert(`Payment recorded ✅\nInterest: ${fmt(payment.interestPortion)}  •  Principal: ${fmt(payment.principalPortion)}\nRemaining balance: ${fmt(payment.balanceAfter)}\n\nThe schedule for the remaining months has been recalculated.`);
  }
  render();
}
function previewCustomPayment(loanId){
  const el = document.getElementById("customPayPreview");
  const input = document.getElementById("customPayAmount");
  const amt = parseFloat(input.value);
  const loan = DB.loans[loanId];
  const member = DB.members[loan.memberUid];
  if(!amt || amt<=0){ el.innerHTML=""; return; }
  const r = loan.interestRate/100;
  const interestDue = round2(member.remainingBalance*r);
  const interestPortion = round2(Math.min(amt, interestDue));
  let principalPortion = round2(amt - interestPortion);
  if(principalPortion > member.remainingBalance) principalPortion = member.remainingBalance;
  const balanceAfter = round2(member.remainingBalance - principalPortion);
  el.innerHTML = `
    <div class="creds-box">
      <div class="row-between"><span class="muted">Goes to Interest</span><b>${fmt(interestPortion)}</b></div>
      <div class="row-between" style="margin-top:6px;"><span class="muted">Goes to Principal</span><b>${fmt(principalPortion)}</b></div>
      <div class="row-between" style="margin-top:6px;"><span class="muted">Balance After</span><b>${fmt(balanceAfter)}</b></div>
      ${balanceAfter<=0 ? `<div style="margin-top:8px;color:var(--success);font-weight:700;">✅ This fully closes the loan — NOC will be available.</div>` : ""}
    </div>`;
}
function generateNOC(loanId){

  const closedDateStr = new Date(loan.closedDate||timeNow()).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});

      .footer{margin-top:70px;display:flex;justify-content:space-between;font-size:13px;}
      .print-btn{display:block;margin:0 auto 20px;padding:10px 20px;background:#0D47A1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;}
      @media print{ .print-btn{display:none;} }
    </style></head><body>
    <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
    <h1>NO OBJECTION CERTIFICATE</h1>
    <div class="sub">Group Finance Manager</div>
    <p>This is to certify that <b>${member.name}</b> (Member ID: ${member.userId}, Mobile: ${member.mobile})
    had availed a loan of <b>${fmt(loan.principal)}</b> from this group on ${startDateStr}.</p>
    <div class="box">
      <div class="row"><span class="label">Loan Principal</span>${fmt(loan.principal)}</div>
      <div class="row"><span class="label">Total Interest Paid</span>${fmt(loan.interestCollectedSoFar||0)}</div>
      <div class="row"><span class="label">Total Amount Repaid</span>${fmt(totalRepaid)}</div>
      <div class="row"><span class="label">Loan Closed On</span>${closedDateStr}${loan.closedEarly?" (Foreclosed)":""}</div>
    </div>
    <p>The above loan account stands <b>fully repaid and closed</b>. The organization confirms it has
    <b>no objection</b> and there are no further dues outstanding against the above member for this loan.</p>
    <div class="footer">
      <div>Date: ${new Date().toLocaleDateString("en-IN")}</div>
      <div style="text-align:right;">Authorized Signatory<br/>${b.accountHolder||"Group Finance Manager"}</div>
    </div>
    </body></html>`);
  win.document.close();
}

  <input type="text" id="bdIfsc" value="${b.ifsc||''}" placeholder="e.g. SBIN0001234" />
  <label class="field-label">UPI ID</label>
  <input type="text" id="bdUpi" value="${b.upi||''}" placeholder="e.g. groupname@upi" />
  <label class="field-label">QR Code / Barcode Image</label>
  <input type="file" id="bdQrFile" accept="image/*" onchange="previewBankQr()" />
  <div id="bdQrPreview" style="margin-top:10px;">${b.qrImage?`<img src="${b.qrImage}" class="chat-img" style="max-height:200px;"/>`:""}</div>
  <button class="btn" onclick="saveBankDetails()">Save Details</button>
  <button class="btn secondary" onclick="go('admin-dashboard')">Back</button>`;
}
let pendingBankQrBase64 = null;
async function previewBankQr(){
  const file = document.getElementById("bdQrFile").files[0];
  if(!file) return;
  pendingBankQrBase64 = await fileToBase64(file);
  document.getElementById("bdQrPreview").innerHTML = `<img src="${pendingBankQrBase64}" class="chat-img" style="max-height:200px;"/>`;
}
function saveBankDetails(){
  const details = {
    accountHolder: document.getElementById("bdHolder").value.trim(),
    bankName: document.getElementById("bdBank").value.trim(),
    accountNumber: document.getElementById("bdAccNo").value.trim(),
    ifsc: document.getElementById("bdIfsc").value.trim(),
    upi: document.getElementById("bdUpi").value.trim(),
  };
  if(pendingBankQrBase64) details.qrImage = pendingBankQrBase64;
  dbUpdateBankDetails(details);
  pendingBankQrBase64 = null;
  alert("Payment / bank details saved. Members will now see this.");
  go("admin-dashboard");
}
function renderBankDetailsCard(){
  const b = DB.settings.bankDetails || {};
  if(!b.accountHolder && !b.bankName && !b.upi && !b.qrImage) return "";
  return `
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">Where to Pay</h2>
    ${b.accountHolder?`<div class="list-row"><div>Account Holder</div><div>${b.accountHolder}</div></div>`:""}
    ${b.bankName?`<div class="list-row"><div>Bank</div><div>${b.bankName}</div></div>`:""}
    ${b.accountNumber?`<div class="list-row"><div>Account No.</div><div>${b.accountNumber}</div></div>`:""}
    ${b.ifsc?`<div class="list-row"><div>IFSC</div><div>${b.ifsc}</div></div>`:""}
    ${b.upi?`<div class="list-row"><div>UPI ID</div><div>${b.upi}</div></div>`:""}
    ${b.qrImage?`<img src="${b.qrImage}" class="chat-img" style="max-height:220px;margin-top:8px;"/>`:""}
  </div>`;
}

/* ---------------------------- ADMIN TRANSACTIONS ---------------------------- */
function viewAdminTransactions(){
  const all = dbAllTransactions();
  const filtered = state.transFilter==="All" ? all : all.filter(t=>t.type===state.transFilter);
  return `
  <div>
    ${["All","Contribution","EMI Payment","Loan Payment (Partial)","Loan Closure Payment","Manual Interest Payment"].map(f=>`<span class="chip ${state.transFilter===f?'active':''}" onclick="state.transFilter='${f}'; render();">${f}</span>`).join("")}
  </div>
  ${filtered.length ? filtered.map(t=>{
    const m = DB.members[t.memberUid];
    return `<div class="card">
      <div class="row-between">
        <div><div style="font-weight:700;">${m?m.name:"Unknown"}</div><div class="muted">${t.type} • ${t.month||""}</div></div>
        <div style="font-weight:700;color:var(--success);">${fmt(t.amount)}</div>
      </div>
    </div>`;
  }).join("") : `<div class="empty-state">No transactions yet.</div>`}`;
}

/* ------------------------------- ADMIN REPORTS ------------------------------ */
function viewAdminReports(){
  const members = dbListMembers();
  const loans = dbListLoans();
  const txns = dbAllTransactions();
  const totalCollection = members.reduce((s,m)=>s+(m.totalDeposit||0),0);
  const activeLoans = loans.filter(l=>l.status==="Active").length;
  return `
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">Monthly Summary</h2>
    <div class="list-row"><div>Total Members</div><div>${members.length}</div></div>
    <div class="list-row"><div>Total Collection</div><div>${fmt(totalCollection)}</div></div>
    <div class="list-row"><div>Active Loans</div><div>${activeLoans}</div></div>
    <div class="list-row"><div>Total Transactions</div><div>${txns.length}</div></div>
  </div>
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">Export Reports</h2>
    <button class="btn" onclick="exportCsv()">Export Transactions (CSV / Excel)</button>
    <button class="btn secondary" onclick="exportSummaryText()">Export Summary (Text)</button>
  </div>`;
}
function exportCsv(){
  const rows = ["Member,Type,Amount,Month,Date"];
  dbAllTransactions().forEach(t=>{
    const m = DB.members[t.memberUid];
    rows.push(`${m?m.name:"Unknown"},${t.type},${t.amount},${t.month||""},${new Date(t.paidAt).toLocaleDateString()}`);
  });
  downloadBlob(rows.join("\n"), "transactions_report.csv", "text/csv");
}
function exportSummaryText(){
  const t = dbDashboardTotals();
  const text = `Group Finance Manager - Summary Report\n\nTotal Collection: ${fmt(t.totalCollection)}\nTotal Loans Given: ${fmt(t.totalLoansGiven)}\nTotal Interest Earned: ${fmt(t.totalInterestEarned)}\nPending Repayments: ${t.pendingRepayments}\n`;
  downloadBlob(text, "summary_report.txt", "text/plain");
}
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* -------------------------------- MEMBER VIEWS ------------------------------ */
function viewMemberDashboard(){
  const u = currentUser();
  const m = DB.members[u.uid];
  const loan = dbGetActiveLoan(u.uid);
  return `
  <div class="card" style="background:var(--primary);color:#fff;border:none;">
    <div style="font-size:12px;opacity:.85;">Total Contributed</div>
    <div style="font-size:26px;font-weight:800;margin-top:4px;">${fmt(m.totalDeposit)}</div>
  </div>
  <div class="grid2">
    <div class="card"><div class="stat-value">${loan?fmt(loan.principal):"None"}</div><div class="stat-label">Loan Taken</div></div>
    <div class="card"><div class="stat-value">${fmt(m.remainingBalance)}</div><div class="stat-label">Remaining Balance</div></div>
  </div>
  ${loan ? `
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">EMI Details</h2>
    <div class="list-row"><div>Fixed Monthly Principal</div><div>${fmt(loan.monthlyPrincipal)}</div></div>
    <div class="list-row"><div>Interest Rate</div><div>${loan.interestRate}% / month (on balance)</div></div>
    <div class="list-row"><div>This Month's Payment</div><div>${fmt((dbGetSchedule(loan.id).find(s=>s.status!=='Paid')||{}).emi || 0)}</div></div>
    <div class="list-row"><div class="muted" style="font-size:11px;">— of which Principal / Interest</div><div class="muted" style="font-size:11px;">${(()=>{ const nx=dbGetSchedule(loan.id).find(s=>s.status!=='Paid'); return nx ? fmt(nx.principalPaid)+" / "+fmt(nx.interestPaid) : "—"; })()}</div></div>
    <div class="list-row"><div>Duration</div><div>${loan.durationMonths} months</div></div>
  </div>` : `<div class="card empty-state">You have no active loan right now.</div>`}
  ${renderBankDetailsCard()}
  ${isPastPenaltyDeadline() && !DB.contributions.some(c=>c.memberUid===u.uid && c.month===currentMonthLabel()) ? `<div class="banner" style="background:#FBE1E1;border-color:#F0B0B0;color:var(--danger);">⚠️ It's past the ${PENALTY_DEADLINE_DAY}th — this month's contribution is now late and will attract a ${fmt(PENALTY_AMOUNT)} penalty on top of ${fmt(CONTRIBUTION_AMOUNT)}.</div>` : ""}
  <button class="btn outline" onclick="go('member-upload',{proofFor:'contribution'})">Upload Contribution Proof</button>

  ${renderMyPaymentDetailsCard(m)}`;
}
// Every logged-in person (member OR admin) has their own personal payout account —
// this is separate from the group's shared "main account" (DB.settings.bankDetails).
function renderMyPaymentDetailsCard(m){
  return `
  <div class="card">
    <h2 class="section-title" style="margin-top:0;">My Bank / Payment Details</h2>
    <div class="muted">Add your own account details here so money (loan disbursement, refunds, etc.) can be transferred directly to you. This is separate from the group's main collection account.</div>
    <label class="field-label">Account Holder Name</label>
    <input type="text" id="myBdHolder" value="${(m.paymentDetails&&m.paymentDetails.accountHolder)||''}" placeholder="e.g. ${m.name}" />
    <label class="field-label">Bank Name</label>
    <input type="text" id="myBdBank" value="${(m.paymentDetails&&m.paymentDetails.bankName)||''}" placeholder="e.g. HDFC Bank" />
    <label class="field-label">Account Number</label>
    <input type="text" id="myBdAccNo" value="${(m.paymentDetails&&m.paymentDetails.accountNumber)||''}" placeholder="e.g. 1234567890123" />
    <label class="field-label">IFSC Code</label>
    <input type="text" id="myBdIfsc" value="${(m.paymentDetails&&m.paymentDetails.ifsc)||''}" placeholder="e.g. HDFC0001234" />
    <label class="field-label">UPI ID</label>
    <input type="text" id="myBdUpi" value="${(m.paymentDetails&&m.paymentDetails.upi)||''}" placeholder="e.g. yourname@upi" />
    <label class="field-label">QR Code Image (optional)</label>
    <input type="file" id="myBdQrFile" accept="image/*" onchange="previewMyBankQr()" />
    <div id="myBdQrPreview" style="margin-top:10px;">${(m.paymentDetails&&m.paymentDetails.qrImage)?`<img src="${m.paymentDetails.qrImage}" class="chat-img" style="max-height:180px;"/>`:""}</div>
    <button class="btn" onclick="saveMyPaymentDetails()">Save My Details</button>
  </div>`;
}
/* -------------------------- MEMBER-FACING MEMBERS LIST ----------------------- */
function viewMemberMembersList(){
  const members = sortMembersAdminsFirst(dbListMembers());
  const search = (state.memberSearch||"").toLowerCase();
  const filtered = members.filter(m=> !search || m.name.toLowerCase().includes(search) || m.mobile.includes(search) || m.userId.toLowerCase().includes(search));
  return `
  <div class="muted" style="margin-bottom:8px;">Total Members: <b style="color:var(--text);">${members.length}</b></div>
  <input type="text" placeholder="Search by name, mobile, or ID" value="${state.memberSearch||""}" oninput="state.memberSearch=this.value; renderMemberMembersListOnly();" />
  <div id="memberMembersList">${renderMemberMembersListItems(filtered)}</div>`;
}
function renderMemberMembersListItems(list){
  if(!list.length) return `<div class="empty-state">No members found.</div>`;
  return list.map(m=>{
    const mu = DB.users.find(x=>x.uid===m.uid);
    const isThisAdmin = mu && mu.role==="admin";
    return `
    <div class="card">
      <div style="display:flex;align-items:center;">
        <div class="avatar">${m.name[0].toUpperCase()}</div>
        <div>
          <div style="font-weight:700;">${m.name}${isThisAdmin?` <span class="badge" style="background:var(--primary);color:#fff;">Admin</span>`:""}</div>
          <div class="muted">${m.userId} • ${m.mobile}${contactIcons(m.mobile, m.name)}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}
function renderMemberMembersListOnly(){
  const search = (state.memberSearch||"").toLowerCase();
  const filtered = sortMembersAdminsFirst(dbListMembers()).filter(m=> !search || m.name.toLowerCase().includes(search) || m.mobile.includes(search) || m.userId.toLowerCase().includes(search));
  document.getElementById("memberMembersList").innerHTML = renderMemberMembersListItems(filtered);
}
let pendingMyBankQrBase64 = null;
async function previewMyBankQr(){
  const file = document.getElementById("myBdQrFile").files[0];
  if(!file) return;
  pendingMyBankQrBase64 = await fileToBase64(file);
  document.getElementById("myBdQrPreview").innerHTML = `<img src="${pendingMyBankQrBase64}" class="chat-img" style="max-height:180px;"/>`;
}
function saveMyPaymentDetails(){
  const u = currentUser();
  const details = {
    accountHolder: document.getElementById("myBdHolder").value.trim(),
    bankName: document.getElementById("myBdBank").value.trim(),
    accountNumber: document.getElementById("myBdAccNo").value.trim(),
    ifsc: document.getElementById("myBdIfsc").value.trim(),
    upi: document.getElementById("myBdUpi").value.trim(),
  };
  if(pendingMyBankQrBase64) details.qrImage = pendingMyBankQrBase64;
  dbUpdateMemberPaymentDetails(u.uid, details);
  pendingMyBankQrBase64 = null;
  alert("Your payment details are saved. The admin can now see them to transfer money to you.");
  render();
}

function viewMemberLoan(){
  const u = currentUser();
  const loan = dbGetActiveLoan(u.uid);
  const allLoans = dbListLoans().filter(l=>l.memberUid===u.uid).sort((a,b)=> new Date(b.startDate)-new Date(a.startDate));
  const closedLoans = allLoans.filter(l=>l.status==="Closed");
  const closedLoansHtml = closedLoans.length ? `
    <h2 class="section-title">Closed Loans</h2>
    ${closedLoans.map(l=>`
      <div class="card">
        <div class="row-between">
          <div><div style="font-weight:700;">${fmt(l.principal)}</div><div class="muted">Closed ${new Date(l.closedDate).toLocaleDateString()}${l.closedEarly?' (Foreclosed)':''}</div></div>
          <a onclick="generateNOC('${l.id}')">Download NOC</a>
        </div>
      </div>`).join("")}` : "";
  if(!loan) return `<div class="empty-state">You don't have an active loan right now.</div>${closedLoansHtml}`;
  const schedule = dbGetSchedule(loan.id);
  return `
  <div class="card" style="background:var(--primary);color:#fff;border:none;">
    <div style="font-size:12px;opacity:.85;">Loan Amount</div>
    <div style="font-size:24px;font-weight:800;margin:4px 0 12px;">${fmt(loan.principal)}</div>
    <div style="display:flex;justify-content:space-between;">
      <div><div style="font-weight:800;">${fmt(loan.monthlyPrincipal)}</div><div style="font-size:10px;opacity:.85;">Fixed Principal/mo</div></div>
      <div><div style="font-weight:800;">${loan.interestRate}%/mo</div><div style="font-size:10px;opacity:.85;">Rate (on balance)</div></div>
      <div><div style="font-weight:800;">${loan.durationMonths} mo</div><div style="font-size:10px;opacity:.85;">Duration</div></div>
    </div>
  </div>
  <div class="banner">💡 Your monthly payment goes down over time — interest is charged only on your remaining balance, which shrinks every month.</div>
  <h2 class="section-title">Repayment Schedule</h2>
  ${schedule.map(s=>{
    const overdue = s.status!=="Paid" && isOverdue(s.dueDate);
    return `<div class="card">
      <div class="row-between">
        <div>
          <div style="font-weight:700;">Month ${s.month}</div>
          <div class="muted">Due: ${new Date(s.dueDate).toLocaleDateString()}</div>
        </div>
        <span class="badge ${s.status==='Paid'?'paid':overdue?'overdue':'pending'}">${s.status==='Paid'?'Paid':overdue?'Overdue':'Pending'}</span>
      </div>
      <div class="row-between" style="margin-top:8px;">
        <div class="muted">Principal ${fmt(s.principalPaid)} + Interest ${fmt(s.interestPaid)}</div>
        <div style="font-weight:800;">${fmt(s.emi)}</div>
      </div>
      ${s.status!=="Paid" ? `<div style="text-align:right;margin-top:4px;"><a onclick="go('member-upload',{proofFor:'emi',proofLoanId:'${loan.id}',proofMonth:${s.month}})">Upload Proof</a></div>` : ""}
    </div>`;
  }).join("")}
  ${renderBankDetailsCard()}
  ${closedLoansHtml}`;
}

function viewMemberHistory(){
  const u = currentUser();
  const contribs = dbListContributions(u.uid).map(c=>({type:"Contribution", amount:c.amount, label:c.month+(c.penalty?` (incl. ${fmt(c.penalty)} penalty)`:""), status:"Paid"}));
  const loan = dbGetActiveLoan(u.uid);
  const emis = loan ? dbGetSchedule(loan.id).map(s=>({type:"EMI Payment", amount:s.emi, label:"Month "+s.month, status:s.status})) : [];
  const items = [...contribs, ...emis];
  return items.length ? items.map(i=>`
    <div class="card">
      <div class="row-between">
        <div><div style="font-weight:700;">${i.type}</div><div class="muted">${i.label}</div></div>
        <div style="font-weight:700;">${fmt(i.amount)}</div>
        <span class="badge ${i.status==='Paid'?'paid':'pending'}">${i.status}</span>
      </div>
    </div>`).join("") : `<div class="empty-state">No payment history yet.</div>`;
}

function viewUploadProof(){
  const label = state.proofFor==="emi" ? `Upload proof for Month ${state.proofMonth} EMI` : "Upload Contribution Proof";
  const showPenaltyWarning = state.proofFor!=="emi" && isPastPenaltyDeadline();
  return `
  <h2 class="section-title" style="margin-top:0;">${label}</h2>
  ${showPenaltyWarning ? `<div class="banner" style="background:#FBE1E1;border-color:#F0B0B0;color:var(--danger);">⚠️ Contributions must be deposited by the ${PENALTY_DEADLINE_DAY}th of the month. Since it's past that date, a ${fmt(PENALTY_AMOUNT)} late penalty will be added to your ${fmt(CONTRIBUTION_AMOUNT)} contribution once approved.</div>` : ""}
  <input type="file" id="proofFile" accept="image/*" onchange="previewProof()" />
  <div id="proofPreview" style="margin-top:10px;"></div>
  <button class="btn" onclick="submitProof()">Submit for Review</button>
  <button class="btn secondary" onclick="go(${isAdmin()?"'admin-dashboard'":"'member-dashboard'"})">Cancel</button>`;
}
let pendingProofBase64 = null;
async function previewProof(){
  const file = document.getElementById("proofFile").files[0];
  if(!file) return;
  pendingProofBase64 = await fileToBase64(file);
  document.getElementById("proofPreview").innerHTML = `<img src="${pendingProofBase64}" class="chat-img" style="max-height:200px;"/>`;
}
function submitProof(){
  if(!pendingProofBase64){ alert("Please select a payment screenshot first."); return; }
  const u = currentUser();
  if(state.proofFor==="emi"){
    dbSubmitProof(u.uid, "EMI", state.proofLoanId, state.proofMonth, pendingProofBase64);
  } else {
    dbSubmitProof(u.uid, "Contribution", null, currentMonthLabel(), pendingProofBase64);
  }
  pendingProofBase64 = null;
  alert("Submitted for admin review. It will reflect in your account once approved.");
  go(isAdmin() ? "admin-dashboard" : "member-dashboard");
}

/* ---------------------------------- CHAT ------------------------------------ */
function viewChat(){
  const u = currentUser();
  const messages = DB.chat.map(msg=>{
    const mine = msg.senderUid===u.uid;
    return `<div class="chat-bubble-wrap" style="justify-content:${mine?'flex-end':'flex-start'};">
      <div class="chat-bubble ${mine?'mine':'other'}">
        ${!mine ? `<div class="chat-sender">${msg.senderName}</div>` : ""}
        ${msg.imageUrl ? `<img src="${msg.imageUrl}" class="chat-img"/>` : `<div>${msg.text}</div>`}
        ${isAdmin() ? `<div style="text-align:right;margin-top:4px;"><a style="font-size:10px;color:${mine?'#cfe0ff':'var(--danger)'};" onclick="deleteMsg('${msg.id}')">delete</a></div>` : ""}
      </div>
    </div>`;
  }).join("");
  setTimeout(()=>{ const c=document.getElementById("chatScroll"); if(c) c.scrollTop=c.scrollHeight; },0);
  return `
  <div id="chatScroll" style="max-height:60vh;overflow-y:auto;margin-bottom:10px;">
    ${messages || `<div class="empty-state">No messages yet. Say hello 👋</div>`}
  </div>
  <div class="chat-input-row" style="position:relative;">
    <input type="file" id="chatImgInput" accept="image/*" style="display:none;" onchange="sendChatImage()" />
    <button class="icon-btn" style="color:var(--primary);" onclick="document.getElementById('chatImgInput').click()">🖼️</button>
    <input type="text" id="chatText" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatText();" />
    <button class="icon-btn" style="background:var(--primary);border-radius:50%;" onclick="sendChatText()">➤</button>
  </div>`;
}
function sendChatText(){
  const u = currentUser();
  const el = document.getElementById("chatText");
  const text = el.value.trim();
  if(!text) return;
  dbSendChat(u.uid, u.name, text, null);
  el.value = "";
  render();
}
async function sendChatImage(){
  const u = currentUser();
  const file = document.getElementById("chatImgInput").files[0];
  if(!file) return;
  const base64 = await fileToBase64(file);
  dbSendChat(u.uid, u.name, null, base64);
  render();
}
function deleteMsg(id){ dbDeleteChat(id); render(); }

/* ---------------------------------- BOOT ------------------------------------ */
startApp();
</script>
